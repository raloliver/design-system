<div class="flex min-h-dvh flex-col items-center justify-center gap-2">
  <div class="flex flex-wrap items-center justify-center gap-2">
    <app-button label="Small" size="sm" />
    <app-button label="Medium" variant="info" size="md" />
    <app-button label="Large" variant="info" size="lg" />
    <app-button label="X-Large" variant="info" size="xl" />
  </div>

  <div class="flex flex-wrap items-center justify-center gap-2">
    <app-button label="Loading" [loading]="true" variant="outline" />
  </div>

  <div class="flex flex-wrap items-center justify-center gap-2">
    <app-button label="Primary" />
    <app-button label="Secondary" variant="secondary" />
    <app-button label="Danger" variant="danger" />
    <app-button label="Outline" variant="outline" />
    <app-button label="Info" variant="info" />
    <app-button label="Success" variant="success" />
    <app-button label="Warning" variant="warning" />
  </div>

  <div class="flex flex-wrap items-center justify-center gap-2">
    <app-button label="plus" icon="plus" variant="outline" />
    <app-button label="minus" icon="minus" variant="outline" />
    <app-button label="check" icon="check" variant="outline" />
    <app-button label="x" icon="x" variant="outline" />
    <app-button label="arrow-right" icon="arrow-right" variant="outline" />
    <app-button label="arrow-left" icon="arrow-left" variant="outline" />
    <app-button label="download" icon="download" variant="outline" />
    <app-button label="upload" icon="upload" variant="outline" />
    <app-button label="trash" icon="trash" variant="outline" />
    <app-button label="edit" icon="edit" variant="outline" />
    <app-button label="eye" icon="eye" variant="outline" />
    <app-button label="heart" icon="heart" variant="outline" />
    <app-button label="star" icon="star" variant="outline" />
    <app-button label="search" icon="search" variant="outline" />
    <app-button label="menu" icon="menu" variant="outline" />
    <app-button label="close" icon="close" variant="outline" />
    <app-button label="settings" icon="settings" variant="outline" />
  </div>
</div>
