<button
  [attr.type]="type()"
  [class]="classes()"
  [disabled]="isInactive()"
  (click)="onClick($event)"
  [attr.aria-label]="label()"
  [attr.aria-busy]="loading()"
  [attr.aria-disabled]="isInactive()"
>
  <!-- Loading spinner -->
  @if (loading()) {
    <svg
      class="animate-spin -ml-1 mr-2"
      [class]="iconClasses()"
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
    >
      <circle
        class="opacity-25"
        cx="12"
        cy="12"
        r="10"
        stroke="currentColor"
        stroke-width="4"
      ></circle>
      <path
        class="opacity-75"
        fill="currentColor"
        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
      ></path>
    </svg>
  }

  <!-- Left icon -->
  @if (showLeftIcon()) {
    <svg
      [class]="iconClasses()"
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        [attr.d]="getIconPath(icon())"
      ></path>
    </svg>
  }

  <!-- Button label -->
  <span [class]="loading() ? 'opacity-0' : ''">
    {{ label() }}
  </span>

  <!-- Right icon -->
  @if (showRightIcon()) {
    <svg
      [class]="iconClasses()"
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        [attr.d]="getIconPath(icon())"
      ></path>
    </svg>
  }
</button>
